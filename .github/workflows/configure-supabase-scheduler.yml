name: Configure Supabase production scheduler

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Create or update pg_cron jobs"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-supabase-scheduler-configuration
  cancel-in-progress: false

jobs:
  configure:
    environment: Production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Preview backed-up history cleanup
        if: ${{ inputs.apply != true }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/cleanup_backed_up_history.py --expected-snapshots 1060615 --archived-max-id 1067994 --backup-sha256 b5762211333fb1e74c9255c8d9228b6e1c2ad08af791f5ea6ceeb8e9411b08d6
      - name: Apply and verify backed-up history cleanup
        if: ${{ inputs.apply == true }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run python scripts/cleanup_backed_up_history.py --expected-snapshots 1060615 --archived-max-id 1067994 --backup-sha256 b5762211333fb1e74c9255c8d9228b6e1c2ad08af791f5ea6ceeb8e9411b08d6 --apply
